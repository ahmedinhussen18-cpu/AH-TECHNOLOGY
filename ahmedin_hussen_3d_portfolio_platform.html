    // --- THREE.JS BACKGROUND SCENE COMPONENT ---
    const ThreeScene = ({ is3DEnabled, prefersReducedMotion }) => {
      const containerRef = useRef(null);
      const rendererRef = useRef(null);
      const [fps, setFps] = useState(60);

      useEffect(() => {
        if (!is3DEnabled || prefersReducedMotion || typeof THREE === 'undefined') return;

        const container = containerRef.current;
        if (!container) return;

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0b, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // Interactive Particle Geometry
        const particleCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0x4f8ff7); // Primary Cyan-Blue
        const color2 = new THREE.Color(0x8b5cf6); // Secondary Purple

        for (let i = 0; i < particleCount * 3; i += 3) {
          positions[i] = (Math.random() - 0.5) * 60;
          positions[i + 1] = (Math.random() - 0.5) * 60;
          positions[i + 2] = (Math.random() - 0.5) * 60;

          const mixedColor = color1.clone().lerp(color2, Math.random());
          colors[i] = mixedColor.r;
          colors[i + 1] = mixedColor.g;
          colors[i + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 0.18,
          vertexColors: true,
          transparent: true,
          opacity: 0.75,
          blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Rotating Wireframe Torus Knot (Center Visual Feature)
        const torusGeo = new THREE.TorusKnotGeometry(4.5, 1.2, 120, 16);
        const torusMat = new THREE.MeshBasicMaterial({
          color: 0x4f8ff7,
          wireframe: true,
          transparent: true,
          opacity: 0.18
        });
        const torusKnot = new THREE.Mesh(torusGeo, torusMat);
        torusKnot.position.set(0, 0, -5);
        scene.add(torusKnot);

        // Mouse Parallax Interaction
        let mouseX = 0;
        let mouseY = 0;
        const handleMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', handleMouseMove);

        // Resize Listener
        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        // Animation Loop & FPS Measurement
        let frameCount = 0;
        let lastTime = performance.now();
        let animationFrameId;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          // Rotate Objects
          particleSystem.rotation.y += 0.0008;
          particleSystem.rotation.x += 0.0003;

          torusKnot.rotation.x += 0.003;
          torusKnot.rotation.y += 0.005;

          // Gentle Mouse Follow
          camera.position.x += (mouseX * 2 - camera.position.x) * 0.03;
          camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
          camera.lookAt(scene.position);

          renderer.render(scene, camera);

          // FPS Metrics Calculation
          frameCount++;
          const currentTime = performance.now();
          if (currentTime >= lastTime + 1000) {
            setFps(Math.round((frameCount * 1000) / (currentTime - lastTime)));
            frameCount = 0;
            lastTime = currentTime;
          }
        };

        animate();

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
          geometry.dispose();
          material.dispose();
          torusGeo.dispose();
          torusMat.dispose();
          renderer.dispose();

                      <div className="p-3 rounded-lg border border-borderDark bg-surfaceDark">
                        <div className="text-secondary font-bold">Postgres & Redis</div>
                        <div className="text-[10px] text-slate-500">Prisma Accelerate</div>
                      </div>
                    </div>
                  </div>

                  {/* Live Endpoint Tester */}
                  <div>
                    <div className="text-slate-400 uppercase text-[10px] mb-2 tracking-wider">REST API Endpoints</div>
                    <div className="space-y-3">
                      <div className="p-3 rounded-xl bg-[#0a0a0b] border border-borderDark flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold">GET</span>
                          <span className="text-slate-200">/api/projects</span>
                        </div>
                        <span className="text-slate-500">Returns 200 OK (JSON)</span>
                      </div>

                      <div className="p-3 rounded-xl bg-[#0a0a0b] border border-borderDark flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold">POST</span>
                          <span className="text-slate-200">/api/contact</span>
                        </div>
                        <span className="text-slate-500">Rate Limited (10 req/h)</span>
                      </div>

                      <div className="p-3 rounded-xl bg-[#0a0a0b] border border-borderDark flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold">GET</span>
                          <span className="text-slate-200">/api/health</span>
                        </div>
                        <span className="text-emerald-400 font-bold">HEALTHY (14ms)</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 3. PROJECT DETAIL MODAL */}
          {activeModal === 'project' && selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-lg overflow-y-auto">
              <div className="bg-surfaceDark border border-borderDark w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden my-8">
                <div className="relative h-64 bg-[#0a0a0b]">
                  <img src={selectedProject.thumbnail} alt={selectedProject.title} className="w-full h-full object-cover" />
                  <button
                    onClick={() => setActiveModal(null)}
                    className="absolute top-4 right-4 p-2 rounded-full bg-black/60 text-white hover:bg-black"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="px-3 py-1 rounded-full bg-tertiary/10 text-tertiary border border-tertiary/30 text-xs font-mono font-semibold">
                      {selectedProject.category}
                    </span>
                    <span className="text-xs font-mono text-slate-400">Status: {selectedProject.status}</span>
                  </div>

                  <h2 className="text-2xl font-bold text-white">{selectedProject.title}</h2>
                  <p className="text-slate-300 text-sm leading-relaxed">{selectedProject.longDescription || selectedProject.description}</p>

                  <div className="pt-2">
                    <div className="text-xs font-mono text-slate-400 mb-2">TECHNOLOGY STACK</div>
                    <div className="flex flex-wrap gap-2">
                      {selectedProject.tags.map((t, idx) => (
                        <span key={idx} className="px-2.5 py-1 rounded bg-[#0a0a0b] border border-borderDark text-xs font-mono text-slate-300">
                          {t}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center justify-end space-x-3 pt-4 border-t border-borderDark/60">
                    <a
                      href={selectedProject.githubUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="px-4 py-2 rounded-xl bg-[#0a0a0b] border border-borderDark text-xs font-mono text-slate-300 hover:text-white flex items-center space-x-1.5"
                    >
                      <Icon name="Github" className="w-4 h-4" />
                      <span>Source Code</span>
                    </a>
                    <a
                      href={selectedProject.liveUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="px-4 py-2 rounded-xl bg-tertiary text-slate-950 font-bold text-xs font-mono hover:opacity-90 flex items-center space-x-1.5"
                    >
                      <Icon name="ExternalLink" className="w-4 h-4" />
                      <span>Launch Live App</span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 4. BLOG READER MODAL */}
          {activeModal === 'blog' && selectedArticle && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-lg overflow-y-auto">
              <div className="bg-surfaceDark border border-borderDark w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden my-8">
                <div className="p-6 bg-[#0a0a0b] border-b border-borderDark flex items-center justify-between">
                  <div>
                    <span className="text-xs font-mono text-tertiary">{selectedArticle.readTime} · {selectedArticle.publishedAt}</span>
                    <h2 className="text-xl font-bold text-white mt-1">{selectedArticle.title}</h2>
                  </div>
                  <button
                    onClick={() => setActiveModal(null)}
                    className="p-2 rounded-xl bg-surfaceDark border border-borderDark text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                  <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-line font-sans">
                    {selectedArticle.content}
                  </p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
